  /api/projects/{project_id}/intake:
    post:
      tags:
      - intake
      summary: 提交材料接入
      description: 提交一份纯文本材料，进入异步受理判断（接收／退回补充／排除三值结论，三拍制，2026-08-08 用户裁定保留）。成功返回接入上下文与任务标识，结论经「读取接入结论」查询；同一幂等键重放返回同一上下文。正文为空或项目未选定返回业务拒绝信封（200）。
      operationId: submit_intake_api_projects__project_id__intake_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntakeSubmitCommand'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SuccessOfIntakeReceipt'
                - $ref: '#/components/schemas/BusinessRejectionEnvelope'
                title: Response Submit Intake Api Projects  Project Id  Intake Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/intake/{context_ref}:
    get:
      tags:
      - intake
      summary: 读取接入结论
      description: 按接入上下文标识查询受理结论与依据；判断中、判断失败停靠、三值结论都是合法读取结果，结论为「接收」时返回正式材料标识。上下文不存在返回
        404。
      operationId: read_intake_result_api_projects__project_id__intake__context_ref__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: context_ref
        in: path
        required: true
        schema:
          type: string
          title: Context Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOfIntakeConclusion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
