components:
  schemas:
    ActionFact:
      properties:
        key:
          type: string
          title: Key
          description: 动作标识，例如「重新提交」。
        enabled:
          type: boolean
          title: Enabled
          description: 该动作当前是否可执行——由后端领域规则裁定，前端不自行推断。
        disabled_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Disabled Reason
          description: 不可执行时的原因说明，供界面展示。
      type: object
      required:
      - key
      - enabled
      title: ActionFact
      description: 可执行动作事实（领域裁定）；ViewModel 映射为 ActionVM，前端不自算门禁。
    AgentRunEventRead:
      properties:
        event:
          type: string
          title: Event
        at:
          type: string
          title: At
      type: object
      required:
      - event
      - at
      title: AgentRunEventRead
    AgentRunRead:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          title: Kind
        status:
          type: string
          title: Status
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        events:
          items:
            $ref: '#/components/schemas/AgentRunEventRead'
          type: array
          title: Events
      type: object
      required:
      - id
      - kind
      - status
      title: AgentRunRead
      description: 异步任务进度（agentRunApi.get）。
    AiCalibrationBucketRead:
      properties:
        range:
          type: string
          title: Range
        avg_confidence:
          type: number
          title: Avg Confidence
        accuracy:
          type: number
          title: Accuracy
        count:
          type: integer
          title: Count
      type: object
      required:
      - range
      - avg_confidence
      - accuracy
      - count
      title: AiCalibrationBucketRead
    AiCalibrationRead:
      properties:
        ece:
          anyOf:
          - type: number
          - type: 'null'
          title: Ece
        rating:
          type: string
          title: Rating
          default: insufficient
        sample_size:
          type: integer
          title: Sample Size
          default: 0
        buckets:
          items:
            $ref: '#/components/schemas/AiCalibrationBucketRead'
          type: array
          title: Buckets
      type: object
      title: AiCalibrationRead
      description: 置信度校准（样本=识别明细×要素置信度；口径设计 §5.2）。
    AiCoverageRead:
      properties:
        touched:
          type: integer
          title: Touched
          default: 0
        untouched:
          type: integer
          title: Untouched
          default: 0
        not_applicable:
          type: integer
          title: Not Applicable
          default: 0
        total_items:
          type: integer
          title: Total Items
          default: 0
      type: object
      title: AiCoverageRead
    AiDeliveryFailureInstanceRead:
      properties:
        occurred_at:
          type: string
          title: Occurred At
        failure_stage:
          type: string
          title: Failure Stage
        detail:
          type: string
          title: Detail
          default: ''
        subject_req_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Req No
        run_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Status
      type: object
      required:
      - occurred_at
      - failure_stage
      title: AiDeliveryFailureInstanceRead
      description: '交付失败个案（钻取；口径 §5.5）。白话字段，不含 Prompt/模型原文（AGENTS 硬规 8）。


        run_status = best-effort 关联 AgentRun（kind==stage ∧ context_ref==applies_to_ref）状态，

        用于从统计接入运行态·诊断中心的重试/降级跟进；无法关联时为 null。'
    AiDeliveryFailureInstancesRead:
      properties:
        stage:
          type: string
          title: Stage
        failure_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Stage
        window_days:
          type: integer
          title: Window Days
        total_failed:
          type: integer
          title: Total Failed
          default: 0
        instances:
          items:
            $ref: '#/components/schemas/AiDeliveryFailureInstanceRead'
          type: array
          title: Instances
      type: object
      required:
      - stage
      - window_days
      title: AiDeliveryFailureInstancesRead
      description: GET /projects/{id}/ai-effectiveness/delivery-failures —— 某 lane[×失败关卡]
        的失败个案钻取。
    AiDeliveryFailureRead:
      properties:
        stage:
          type: string
          title: Stage
        total:
          type: integer
          title: Total
          default: 0
        failed:
          type: integer
          title: Failed
          default: 0
        by_failure_stage:
          items:
            $ref: '#/components/schemas/AiFailureStageCountRead'
          type: array
          title: By Failure Stage
      type: object
      required:
      - stage
      title: AiDeliveryFailureRead
      description: '交付失败＝AI 未能交出合法结论（LDM-015 judgement=*_failed），按 lane 聚合。


        与「拒绝率」（人工不采纳，采纳明细 rejected）是正交维度，禁混算（口径设计 §5.5）。

        失败率=failed/total 归前端；total=该 lane 窗口内总判定行数（分母）。'
    AiEffectivenessRead:
      properties:
        project_ref:
          type: string
          title: Project Ref
        window_days:
          type: integer
          title: Window Days
        stages:
          items:
            $ref: '#/components/schemas/AiStageEffectRead'
          type: array
          title: Stages
        calibration:
          $ref: '#/components/schemas/AiCalibrationRead'
        coverage:
