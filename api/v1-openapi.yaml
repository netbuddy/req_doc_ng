          items:
            $ref: '#/components/schemas/AiDeliveryFailureRead'
          type: array
          title: Delivery Failures
      type: object
      required:
      - project_ref
      - window_days
      - calibration
      - coverage
      title: AiEffectivenessRead
      description: GET /projects/{id}/ai-effectiveness —— 只读统计，不改变 LDM-015 处理状态（UINV-23）。
    AiFailureStageCountRead:
      properties:
        failure_stage:
