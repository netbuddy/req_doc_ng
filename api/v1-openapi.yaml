openapi: 3.1.0
info:
  title: req-doc backend
  version: 0.1.0
paths:
  /api/health:
    get:
      tags:
      - infra
      summary: Get Health
      operationId: get_health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthPayload'
  /api/runtime-status:
