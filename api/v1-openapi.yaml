  /api/projects/{project_id}/elements/{parse_context_ref}/dialogue:
    post:
      tags:
      - analysis
      summary: Element Dialogue
      description: 'AEP-096 区5 对话命令解释：命令词确定性解析 + LLM 正文解释 + 校验派发既有端点逻辑。


        `Accept: text/event-stream` 时流式推送 stage 帧 + result 终帧（链路回执条数据源）；

        流式分支自建 session（服务在独立线程执行），不复用请求级依赖注入的 session。'
