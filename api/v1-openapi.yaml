          title: Failure Stage
        count:
          type: integer
          title: Count
          default: 0
      type: object
      required:
      - failure_stage
      title: AiFailureStageCountRead
      description: 失败关卡分桶计数（口径设计 §5.5）。
    AiRiskSignalRead:
