              schema:
                $ref: '#/components/schemas/RuntimeStatusRead'
  /api/notifications:
    get:
      tags:
      - notifications
      summary: List Notifications
      operationId: list_notifications_api_notifications_get
      parameters:
      - name: unread
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Unread
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
