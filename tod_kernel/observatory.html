<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>观测台 · 任务型智能体内核</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1f23;--muted:#62666d;--line:#e2e2de;--accent:#1f5fbf;--accent-bg:#e8f0fc;
--trace:#6b5a2e;--trace-bg:#f3eedf;--hit:#eef6ee;--hit-ink:#1f6b3a;--wait:#8a4b08;--wait-bg:#fdf1e2;
--ext:#7a2e8f;--ext-bg:#f6ecf9;--ext-line:#c89bd6;--tool:#2f6f6a;--diff:#fff3b0;--diff-ink:#6b5400;--same:#f0f0ee;
/* 运行路径（路线图、路径图、时间轴）的令牌，取自原型 v2 */
--grid:#ececea;--ink2:#52514e;--ink3:#8a8985;--path:#2a78d6;--back:#eb6834;--good:#0ca30c;--bad:#d03b3b;
--path-soft:#dce9f9;--back-soft:#fbe4da;--good-soft:#dff3df;--bad-soft:#f8dcdc;--hi:#fff3c4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--panel:#1f2125;--ink:#e6e6e3;--muted:#9a9ea5;--line:#34373c;
--accent:#8db4f0;--accent-bg:#1d2a3d;--trace:#d8c38e;--trace-bg:#2e2a1f;--hit:#1c2b20;--hit-ink:#8fd1a4;--wait:#f0b46a;--wait-bg:#35281a;
--ext:#e0a8f0;--ext-bg:#2f2236;--ext-line:#6f4a7c;--tool:#7fc8c0;--diff:#4a3f10;--diff-ink:#f3dc7a;--same:#26282c;
--grid:#2e2e2c;--ink2:#c3c2b7;--ink3:#8f8e86;--path:#3987e5;--back:#d95926;--good:#0ca30c;--bad:#e66767;
--path-soft:#1f3556;--back-soft:#4a2717;--good-soft:#173a17;--bad-soft:#4a1f1f;--hi:#4a3f12}}
:root[data-theme="dark"]{--bg:#16171a;--panel:#1f2125;--ink:#e6e6e3;--muted:#9a9ea5;--line:#34373c;
--accent:#8db4f0;--accent-bg:#1d2a3d;--trace:#d8c38e;--trace-bg:#2e2a1f;--hit:#1c2b20;--hit-ink:#8fd1a4;--wait:#f0b46a;--wait-bg:#35281a;
--ext:#e0a8f0;--ext-bg:#2f2236;--ext-line:#6f4a7c;--tool:#7fc8c0;--diff:#4a3f10;--diff-ink:#f3dc7a;--same:#26282c;
--grid:#2e2e2c;--ink2:#c3c2b7;--ink3:#8f8e86;--path:#3987e5;--back:#d95926;--good:#0ca30c;--bad:#e66767;
--path-soft:#1f3556;--back-soft:#4a2717;--good-soft:#173a17;--bad-soft:#4a1f1f;--hi:#4a3f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
a{color:var(--accent)}
header.page{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header.page h1{margin:0;font-size:18px}
header.page nav{display:flex;gap:12px;flex-wrap:wrap}
main{padding:0 24px 40px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:16px 0;min-width:0}
h2{margin:0 0 10px;font-size:16px}
h3{margin:0;font-size:14px}
h3 small{font-weight:normal;color:var(--muted);margin-left:6px}
button{font:inherit;padding:4px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button[disabled]{opacity:.5;cursor:default}
select{font:inherit;padding:2px 4px;max-width:100%}
.muted{color:var(--muted)}
.empty{color:var(--muted);margin:0}
.hint{color:var(--muted);margin:0 0 8px}
.error{color:var(--bad)}
.scroll{overflow-x:auto;max-width:100%}
code,pre,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
details>summary{cursor:pointer;color:var(--muted)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain ul.plain{padding-left:1.5em;margin-bottom:.3em}
/* 索引 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.toolbar label{white-space:nowrap}
table.index{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.index th,table.index td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.index th{color:var(--muted);font-weight:normal}
table.index tbody tr{cursor:pointer}
table.index tbody tr:hover{background:var(--accent-bg)}
table.index td.reason{white-space:normal;min-width:8em}
.status{font-weight:600}
.status.done{color:var(--hit-ink)}
.status.error{color:var(--bad)}
/* 详情 */
.filters{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--panel);
border-bottom:1px solid var(--line);padding:8px 24px}
.filters fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.filters legend{float:left;margin-right:6px;color:var(--muted)}
.filters label{white-space:nowrap}
table.kv{border-collapse:collapse;width:100%}
table.kv th{width:11em;text-align:left;vertical-align:top;color:var(--muted);font-weight:normal;padding:6px 12px 6px 0;border-top:1px solid var(--line)}
table.kv td{padding:6px 0;border-top:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.seq{color:var(--muted);font-variant-numeric:tabular-nums}
.src{margin-left:6px;font-size:12px;color:var(--muted)}
.utterance{display:block;font-weight:600;color:var(--ink)}
table.grid{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
table.grid thead th{color:var(--muted);font-weight:normal;white-space:nowrap}
td.hit{background:var(--hit);min-width:10em;max-width:26em}
table.grid tbody th{white-space:nowrap}
table.grid tbody th,table.grid thead th:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}
table.grid td.final{min-width:8em;max-width:16em}
td.hit .val{color:var(--hit-ink);font-weight:600;display:block}
td.hit .src{display:block;margin:0}
td.miss{color:var(--line);text-align:center}
.diff-line{display:block;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px;gap:8px}
.card dl{margin:0;display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 8px}
.card dt{color:var(--muted)}
.card dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* 对比 */
table.compare{border-collapse:collapse;width:100%}
table.compare th,table.compare td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
table.compare thead th{color:var(--muted);font-weight:normal}
table.compare td.diff{background:var(--diff);color:var(--diff-ink)}
table.compare td.same{background:var(--same)}
table.compare td.absent{background:var(--diff);color:var(--diff-ink);font-style:italic}
table.compare td.no{color:var(--muted);text-align:right;white-space:nowrap}
table.compare td[data-field=status]{white-space:nowrap}
/* 运行路径：路线图、路径图、时间轴（样式依据原型 v2） */
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:12px;color:var(--ink2);margin-left:6px;font-weight:normal}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink2);font-size:13px;margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.sw.path{background:var(--path)} .sw.back{background:var(--back)} .sw.good{background:var(--good-soft);border-color:var(--good)}
.sw.bad{background:var(--bad-soft);border-color:var(--bad)} .sw.skip{background:transparent;border:1px dashed var(--ink3)} .sw.never{background:var(--grid)}
svg.rp{display:block}
svg.rp text{font-family:inherit}
.rp-phase{fill:var(--panel);stroke:var(--line);stroke-width:1}
.rp-phase.good{fill:var(--good-soft);stroke:var(--good)}
.rp-phase.bad{fill:var(--bad-soft);stroke:var(--bad)}
.rp-phase.hi{stroke-width:3}
.rp-loop{fill:none;stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3}
.rp-step{fill:var(--path-soft);stroke:var(--path);stroke-width:1.5;cursor:pointer}
.rp-step.skip{fill:transparent;stroke:var(--ink3);stroke-dasharray:4 3}
.rp-step.never{fill:var(--grid);stroke:var(--ink3);stroke-dasharray:4 3}
.rp-step.hi{stroke-width:3.5}
.rp-ttl{fill:var(--ink);font-size:13px;font-weight:600}
.rp-lbl{fill:var(--ink2);font-size:12px}
.rp-small{fill:var(--ink3);font-size:11px}
.rp-count{fill:var(--path);font-size:11px;font-weight:600}
.rp-good{fill:var(--good)} .rp-bad{fill:var(--bad)} .rp-back{fill:var(--back)}
.rp-arrow-back{fill:none;stroke:var(--back);stroke-width:2}
.rp-seq{stroke:var(--ink3);stroke-width:1.5}
.rp-grid{stroke:var(--grid);stroke-width:1}
.rp-axis{fill:var(--ink3);font-size:11px}
.rp-rowlbl{fill:var(--ink2);font-size:12px}
.rp-band{fill:var(--path-soft);opacity:.45}
.rp-band2{fill:var(--grid);opacity:.7}
.rp-bandlbl{fill:var(--ink2);font-size:12px;font-weight:600}
.rp-rowlbl.never{fill:var(--ink3)}
.rp-never{fill:none;stroke:var(--ink3);stroke-width:1.5}
.rp-line{fill:none;stroke:var(--path);stroke-width:2}
.rp-line.back{stroke:var(--back);stroke-dasharray:5 3}
.rp-line.tail{stroke-dasharray:2 3}
.rp-pt{fill:var(--path);stroke:var(--panel);stroke-width:2;cursor:pointer}
.rp-pt.bad{fill:var(--bad)}
.rp-pt.failed{fill:var(--panel);stroke:var(--bad);stroke-width:2.5}
.rp-pt.hi{stroke:var(--ink);stroke-width:2.5}
.rp-cursor{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 3}
.rp-chip{fill:var(--path-soft);stroke:var(--path)}
.tl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:10px}
.tl input[type=range]{flex:1 1 320px;min-width:160px}
.tl .tl-val{font-weight:600;min-width:9em}
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.now-card{border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;overflow-wrap:anywhere}
.now-card.wide{grid-column:1/-1}
.now-card h3{margin:0 0 4px;font-size:13px;color:var(--ink2);font-weight:500}
.now-card .big{font-size:15px;font-weight:600}
table.now-kv{width:100%;border-collapse:collapse;font-size:13px}
table.now-kv td{padding:2px 4px;border-top:1px solid var(--grid);vertical-align:top;overflow-wrap:anywhere}
table.now-kv td:first-child{color:var(--ink2);white-space:nowrap;width:8em}
table.now-kv tr.changed td{background:var(--hi)}
table.now-kv th{text-align:left;color:var(--ink2);font-weight:500;padding:2px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.now-kv tr.sub td:first-child{padding-left:1.5em;color:var(--ink3)}
details.tg[open] .tg-open,details.tg:not([open]) .tg-close{display:none}
.pill{display:inline-block;border-radius:10px;padding:0 8px;font-size:12px;border:1px solid var(--line);color:var(--ink2);font-weight:normal}
.pill.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.pill.back{background:var(--back-soft);border-color:var(--back);color:var(--ink)}
.pill.good{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.card{cursor:pointer}
.card.hi{outline:2px solid var(--path)}
.card.bad{border-color:var(--bad)}
/* 交付物（样式依据原型 v3 的交付物部分） */
.dl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin:6px 0 12px}
.dl-head .dl-n{font-size:15px;font-weight:600}
.dl-head .dl-st{border-radius:10px;padding:1px 10px;font-size:12px;border:1px solid var(--good);background:var(--good-soft);color:var(--ink)}
.dl-head .dl-st.no{border-color:var(--bad);background:var(--bad-soft)}
.dl-head .dl-k{color:var(--ink3);font-size:12px}
.dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px}
.dl-card{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;min-width:0}
.dl-card.wide{grid-column:1/-1}
.dl-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.dl-t b{font-size:14px}
.dl-t .dl-k{color:var(--ink3);font-size:12px}
.dl-t .dl-f{margin-left:auto;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:0 8px;white-space:nowrap}
.dl-body{padding:12px 14px;min-width:0}
.dl-form{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;align-items:baseline}
.dl-form .dl-lb{color:var(--ink2);font-size:13px}
.dl-form .dl-v{font-size:16px;font-weight:600;border-bottom:1px dashed var(--line);padding-bottom:4px;overflow-wrap:anywhere}
.dl-empty{color:var(--ink3);font-weight:400}
table.dl-tb{border-collapse:collapse;width:100%;font-size:13px}
table.dl-tb th{text-align:left;color:var(--ink2);font-weight:500;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
table.dl-tb td{padding:7px 8px;border-bottom:1px solid var(--grid)}
table.dl-tb .num{text-align:right;font-variant-numeric:tabular-nums}
table.dl-tb tbody tr:nth-child(even) td{background:var(--bg)}
.dl-yes{color:var(--good);font-weight:600}
.dl-no{color:var(--ink3)}
.dl-foot{color:var(--ink3);font-size:12px;margin-top:8px}
.dl-missing{color:var(--ink3);font-size:13px;padding:8px 0 0}
.dl-file{display:flex;gap:12px;align-items:flex-start;min-width:0}
.dl-ico{width:38px;height:46px;border:1.5px solid var(--ink3);border-radius:3px;position:relative;flex:none}
.dl-ico:after{content:"";position:absolute;right:-1px;top:-1px;width:12px;height:12px;background:var(--panel);border-left:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3)}
.dl-file .dl-nm{font-weight:600}
.dl-file .dl-pth{color:var(--ink3);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.dl-file details{margin-top:8px}
.dl-file summary{cursor:pointer;color:var(--path);font-size:13px}
.dl-file pre{margin:8px 0 0;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-size:12.5px;line-height:1.6;white-space:pre-wrap}
.dl-txt{border-left:3px solid var(--path);padding:6px 14px;font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.dl-txt .dl-src{color:var(--ink3);font-size:12px;margin-top:6px}
.rp-link{cursor:pointer;text-decoration:underline}
/* 迭代视图（样式依据原型 v3） */
:root{--ext2:#7a3fb5;--ext2-soft:#efe5f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ext2:#b48ae0;--ext2-soft:#33244a}}
:root[data-theme="dark"]{--ext2:#b48ae0;--ext2-soft:#33244a}
.iv-top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:0 0 12px;font-size:13px}
.iv-top label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.iv-card{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:14px;overflow:hidden}
.iv-card.bad{border-color:var(--bad)}
.iv-card.plain{border-style:dashed}
.iv-card.hi{outline:2px solid var(--path)}
.iv-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.iv-hd .no{font-weight:700;font-size:15px}
.iv-hd .where{color:var(--ink2)}
.iv-hd .act{font-weight:600;overflow-wrap:anywhere}
.iv-hd .res{margin-left:auto;font-size:12px;border-radius:10px;padding:0 9px;border:1px solid var(--good);background:var(--good-soft)}
.iv-hd .res.bad{border-color:var(--bad);background:var(--bad-soft)}
.iv-hd .res.wait{border-color:var(--ext2);background:var(--ext2-soft)}
.iv-hd .ms{color:var(--ink3);font-size:12px}
.iv-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:12px 14px 4px;position:relative}
.iv-steps:before{content:"";position:absolute;left:calc(10% + 14px);right:calc(10% + 14px);top:24px;height:2px;background:var(--line)}
.iv-st{position:relative;text-align:center;padding:0 4px;min-width:0}
.iv-st .dot{width:22px;height:22px;border-radius:50%;margin:0 auto 6px;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);position:relative}
.iv-st.ok .dot{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.iv-st.info .dot{border-color:var(--path);background:var(--path-soft);color:var(--path)}
.iv-st.ext .dot{border-color:var(--ext2);background:var(--ext2-soft);color:var(--ext2)}
.iv-st.bad .dot{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.iv-st.skip .dot{border-style:dashed;color:var(--ink3)}
.iv-st .nm{font-size:12px;color:var(--ink2)}
.iv-st .tm{font-size:10.5px;color:var(--ink3);font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.iv-story{display:grid;grid-template-columns:7em minmax(0,1fr);gap:6px 12px;padding:8px 14px 12px}
.iv-k{color:var(--ink3);font-size:12px;padding-top:2px}
.iv-v{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.iv-v.bad{color:var(--ink)}
.iv-sub{display:block;color:var(--ink3);font-size:12px}
.iv-bad{color:var(--bad)}
.iv-chip{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12.5px;background:var(--bg);margin:2px 4px 2px 0;overflow-wrap:anywhere}
.iv-chip.cur{border-color:var(--path);background:var(--path-soft)}
.iv-chip.new{border-color:var(--good);background:var(--good-soft)}
.iv-chat{display:flex;flex-direction:column;gap:6px;max-width:640px}
.iv-msg{display:flex;gap:8px;align-items:flex-start}
.iv-msg .who{flex:none;width:7em;font-size:12px;color:var(--ink3);padding-top:6px;text-align:right}
.iv-msg .bub{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.iv-msg.user .bub{border-color:var(--ext2);background:var(--ext2-soft)}
.iv-msg .meta{font-size:11px;color:var(--ink3);margin-top:2px}
.iv-fn{font-size:10.5px;color:var(--path);vertical-align:super;margin-left:2px;cursor:pointer;text-decoration:none}
.iv-fn:hover{text-decoration:underline}
.iv-toggle{float:right;font:inherit;font-size:11.5px;color:var(--path);cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:var(--panel);margin-left:8px;white-space:nowrap}
.iv-toggle.on{background:var(--path-soft);border-color:var(--path)}
.iv-toggle.none{color:var(--ink3);cursor:default}
.iv-link{color:var(--path);cursor:pointer;text-decoration:underline}
.iv-evs{display:none;grid-column:1/-1;margin:2px 0 6px;border:1px solid var(--grid);border-radius:6px;background:var(--bg);font-size:12px}
.iv-evs.show{display:block}
.iv-evs table{border-collapse:collapse;width:100%;min-width:640px;table-layout:fixed}
.iv-evs td{padding:3px 8px;border-top:1px solid var(--grid);vertical-align:top;color:var(--ink2)}
.iv-evs tr:first-child td{border-top:0}
.iv-evs td.n{color:var(--ink3);white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.iv-evs td.d{overflow-wrap:anywhere}
.iv-evs td.who{color:var(--ink3);overflow-wrap:anywhere}
.iv-evs tr.ext td.who{color:var(--ext2)}
.iv-evs tr.hl td,.iv-evs tr.fm td{background:var(--hi)}
.iv-tag{display:inline-block;border-radius:3px;padding:0 5px;font-size:11px;border:1px solid var(--line)}

<body>
<header class="page">
  <h1>观测台</h1>
  <nav><a href="#">运行索引</a><span id="crumb" class="muted"></span></nav>
</header>
<div id="filters-slot"></div>
<main id="app"><p class="muted">加载中……</p></main>
<script>
"use strict";
// 本页不写死任何任务名、槽位名、工具名；只认识内核固定的事件名词表与循环五步的名称。
const LABELS = {
  TASK_STATUS_CHANGED: "任务状态变化", DATA_CHANGED: "数据变更", ACTION_PROPOSED: "行动提出",
  ACTION_STATUS_CHANGED: "行动状态变化", MESSAGE_PUT: "消息放入", MESSAGE_TAKEN: "消息取出",
  MAILBOX_CLOSED: "邮箱关闭", TASK_ENDED: "任务结束", TASK_STARTED: "任务开始", LOOP_STARTED: "一次迭代开始",
  CHECK_DONE_RESULT: "结果检查结论", CONTROL_RESULT: "执行控制结论", EXECUTE_CALL: "行动执行调用",
  MAILBOX_WAIT: "邮箱等待", TASK_DEFINITION_ERROR: "任务定义错误",
};
// 第三步第十二项起结果检查挪到迭代末尾，进循环前另有一次「启动检查」；更早的运行文件结果检查在迭代开头。
const STEP_NAMES = ["第 1 步 行动选择", "第 2 步 执行控制", "第 3 步 行动执行", "第 4 步 状态更新", "第 5 步 结果检查"];
const OLD_STEP_NAMES = ["第 1 步 结果检查", "第 2 步 行动选择", "第 3 步 执行控制", "第 4 步 行动执行", "第 5 步 状态更新"];
const BOX = { inbox: "收件箱", outbox: "发件箱" };
const EXTERNAL_SENDERS = ["host", "user"];
const PROPOSED = "已提出", FAILED = "已失败";

// ───────────── 小工具 ─────────────
function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function jsonText(value) { return JSON.stringify(value); }
function plain(value) {
  // 给人读的值：None、字符串不加引号（空串写作 “”）、其余用 JSON 写法。
  if (value === null || value === undefined) return "None";
  if (typeof value === "string") return value === "" ? "“”" : value;
  return JSON.stringify(value);
}
function brief(value) {
  // 摘要：列表写「n 项」，字典写「键=值」，其余同 plain。
  if (Array.isArray(value)) return `${value.length} 项`;
  if (value && typeof value === "object") return Object.entries(value).map(([k, v]) => `${k}=${typeof v === "object" && v !== null ? brief(v) : plain(v)}`).join("，");
  return plain(value);
}
function paramsSummary(params) {
  const flat = [];
  (function walk(value, prefix) {
    if (value && typeof value === "object" && !Array.isArray(value)) {
      const entries = Object.entries(value);
      if (!entries.length && prefix) flat.push(`${prefix}=（空）`);
      for (const [k, v] of entries) walk(v, prefix ? `${prefix}.${k}` : k);
    } else {
      flat.push(`${prefix}=${Array.isArray(value) ? JSON.stringify(value) : plain(value)}`);
    }
  })(params || {}, "");
  return flat.length ? flat.join("，") : "无参数";
}
function valueDiff(oldValue, newValue) {
  // 逐项比对算出差异，返回若干行文字；列表按位置、字典按键。
  const lines = [];
  (function walk(a, b, label) {
    if (Array.isArray(a) && Array.isArray(b)) {
      const n = Math.max(a.length, b.length);
      for (let i = 0; i < n; i++) {
        const itemLabel = `${label}第 ${i + 1} 项`;
        if (i >= a.length) lines.push(`新增${itemLabel}：${brief(b[i])}`);
        else if (i >= b.length) lines.push(`删除${itemLabel}：${brief(a[i])}`);
        else walk(a[i], b[i], itemLabel + " ");
      }
    } else if (a && b && typeof a === "object" && typeof b === "object" && !Array.isArray(a) && !Array.isArray(b)) {
      const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])];
      for (const k of keys) {
        if (!(k in a)) lines.push(`${label}新增 ${k}：${plain(b[k])}`);
        else if (!(k in b)) lines.push(`${label}删除 ${k}：${plain(a[k])}`);
        else walk(a[k], b[k], `${label}${k}`);
      }
    } else if (JSON.stringify(a) !== JSON.stringify(b)) {
      const where = label.trim();
      lines.push(`${where ? where + "：" : ""}${brief(a)} → ${brief(b)}`);
    }
  })(oldValue, newValue, "");
  return lines;
}
function isExternal(e) {
  const p = e.payload;
  if (e.name === "MESSAGE_PUT" || e.name === "MAILBOX_CLOSED") return EXTERNAL_SENDERS.includes(p.sender);
  if (e.name === "MESSAGE_TAKEN" || e.name === "MAILBOX_WAIT") return p.box === "outbox";
  return false;
}
function initiatorOf(e) {
  if (e.name === "MESSAGE_PUT" || e.name === "MAILBOX_CLOSED") return e.payload.sender;
  if ((e.name === "MESSAGE_TAKEN" || e.name === "MAILBOX_WAIT") && e.payload.box === "outbox") return "读取发件箱的一方";
  return e.source;
}
function isQuestionSent(e) {
  return e.name === "MESSAGE_PUT" && e.payload.box === "outbox" && !EXTERNAL_SENDERS.includes(e.payload.sender);
}
function originOf(e) {
  if (isExternal(e)) return "external";
  if ((e.source || "").startsWith("tool.")) return "tool";
  return "kernel";
}
function utteranceOf(content) {
  return content && typeof content === "object" && typeof content.utterance === "string" ? content.utterance : null;
}
function mentions(value, word) {
  if (value === word) return true;
  if (Array.isArray(value)) return value.some(v => mentions(v, word));
  if (value && typeof value === "object") return Object.values(value).some(v => mentions(v, word));
  return false;
}
async function fetchJSON(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(`${url} 返回 ${response.status}`);
  return response.json();
}

// ───────────── 一次运行整理成页面要用的结构 ─────────────
function buildRecord(file, events) {
  events = events.slice().sort((a, b) => a.seq - b.seq);
  const r = { file, events, t0: events.length ? events[0].ts : 0 };
  r.taskId = events.length ? events[0].task_id : "（空文件）";
  const started = events.find(e => e.name === "TASK_STARTED");
  r.started = started ? started.payload : null;
  const ended = events.filter(e => e.name === "TASK_ENDED");
  r.ended = ended.length ? ended[ended.length - 1].payload : null;
  r.definitionErrors = events.filter(e => e.name === "TASK_DEFINITION_ERROR");
  r.actions = new Map();
  for (const e of events) if (e.name === "ACTION_PROPOSED") r.actions.set(e.action_id, { proposed: e, events: [] });
  for (const e of events) if (r.actions.has(e.action_id)) r.actions.get(e.action_id).events.push(e);
  r.slots = r.started ? Object.keys(r.started.slots) : [];
  for (const e of events) if (e.name === "DATA_CHANGED" && !r.slots.includes(e.payload.slot)) r.slots.push(e.payload.slot);
  // 与槽位有关的行动：写过它的，以及参数里任何位置提到它的。
  r.actionSlots = new Map();
  for (const [aid, info] of r.actions) {
    const set = new Set();
    for (const slot of r.slots) if (mentions(info.proposed.payload.params, slot)) set.add(slot);
    for (const e of info.events) if (e.name === "DATA_CHANGED") set.add(e.payload.slot);
    r.actionSlots.set(aid, set);
  }
  // 按迭代、按步切分。按事件的实际结构判断：第一个「结果检查结论」在第一个「迭代开始」之前，就是结果检查在迭代末尾的新结构。
  const firstCheck = events.findIndex(e => e.name === "CHECK_DONE_RESULT");
  const firstLoop = events.findIndex(e => e.name === "LOOP_STARTED");
  r.checkAtEnd = firstCheck >= 0 && (firstLoop < 0 || firstCheck < firstLoop);
  r.stepNames = r.checkAtEnd ? STEP_NAMES : OLD_STEP_NAMES;
  r.before = []; r.startCheck = []; r.loops = []; r.closing = [];
  let current = null, step = 0;
  for (const e of events) {
    // 收尾：任务状态变为已完成、内核关闭发件箱、任务结束，从第一条起其后的事件都归收尾卡，不归任何迭代。
    if (r.closing.length || (e.name === "TASK_STATUS_CHANGED" && e.payload.new_status === "已完成")
        || (e.name === "MAILBOX_CLOSED" && e.payload.box === "outbox" && !EXTERNAL_SENDERS.includes(e.payload.sender)) || e.name === "TASK_ENDED") {
      r.closing.push(e); continue;
    }
    if (e.name === "LOOP_STARTED") {
      current = { no: e.payload.loop_no, steps: STEP_NAMES.map(() => []) };
      r.loops.push(current); step = 0; current.steps[0].push(e); continue;
    }
    if (!current) {
      // 新结构里循环前那次结果检查及其后的完成记录单列为「启动检查」，不归任何迭代。
      if (r.checkAtEnd && (r.startCheck.length || e.name === "CHECK_DONE_RESULT")) r.startCheck.push(e); else r.before.push(e);
      continue;
    }
    if (r.checkAtEnd) {
      if (e.name === "CHECK_DONE_RESULT") step = 4;
      current.steps[step].push(e);
      if (step === 0 && e.name === "ACTION_STATUS_CHANGED" && e.payload.new_status === PROPOSED) step = 1;
      else if (e.name === "CONTROL_RESULT") step = 2;
      else if (e.name === "EXECUTE_CALL" && e.payload.phase === "return") step = 3;
      continue;
    }
    current.steps[step].push(e);
    if (e.name === "CHECK_DONE_RESULT" && !e.payload.done) step = 1;
    else if (step === 1 && e.name === "ACTION_STATUS_CHANGED" && e.payload.new_status === PROPOSED) step = 2;
    else if (e.name === "CONTROL_RESULT") step = 3;
    else if (e.name === "EXECUTE_CALL" && e.payload.phase === "return") step = 4;
  }
  // 终态数据：从空数据起按序应用全部数据变更。
  r.finalData = {};
  for (const e of events) if (e.kind === "state" && e.name === "DATA_CHANGED") r.finalData[e.payload.slot] = e.payload.new;
  return r;
}
function slotsOfEvent(r, e) {
  if (e.name === "DATA_CHANGED") return [e.payload.slot];
  return r.actionSlots.has(e.action_id) ? [...r.actionSlots.get(e.action_id)] : [];
}
// 「任务开始」事件里 rules 的值由加载器按阶段与步骤生成，形如「阶段名 › 第 n 步 步骤说明」「阶段名 › 告知异常」「阶段名 › 自主 › 工具名」；
// 分不出阶段的值（第零步、第一步写出的旧文件）返回 null，调用方原样显示。
function parseRuleNote(note) {
  if (typeof note !== "string") return null;
  const i = note.indexOf(" › ");
  if (i < 0) return null;
  const stage = note.slice(0, i), rest = note.slice(i + 3);
  let m = rest.match(/^第 (\d+) 步 ([\s\S]*)$/);
  if (m) return { stage, kind: "step", no: m[1], note: m[2] };
  if (rest === "告知异常") return { stage, kind: "exception" };
  m = rest.match(/^自主 › (.+)$/);
  if (m) return { stage, kind: "toolset", tool: m[1] };
  return null;
}
function basisText(basis) {
  if (!(Array.isArray(basis) && basis.length === 3)) return plain(basis);
  const [number, note, hit] = basis;
  const r = parseRuleNote(note);
  if (!r) return `第 ${number} 步：${plain(note)}；本次值 ${brief(hit)}`;
  if (r.kind === "step") return `第 ${r.no} 步：${r.note}；本次值 ${brief(hit)}`;
  if (r.kind === "exception") return exceptionBasisText(r.stage, hit);
  return `自主：${r.stage} › ${r.tool}。模型的理由：${plain(hit)}`;
}
// 告知异常的依据：命中值是异常报告，取未达成目标的文字；游标所在阶段不是报告的阶段，就是该阶段的目标被后续阶段破坏。
function exceptionBasisText(stage, report) {
  const goals = report && Array.isArray(report["未达成目标"]) ? report["未达成目标"].map(g => g["文字"]).join("；") : brief(report);
  const at = report && report["游标"];
  const broken = at && typeof at === "object" && at["阶段"] !== undefined && at["阶段"] !== stage;
  return `告知异常：「${stage}」阶段${broken ? "的目标在后续阶段被破坏" : "目标未达成"}；本次值 ${goals}`;
}
// 谓词与引用写成文字，与加载器生成「未达成目标」文字的写法一致。
const REF_KEYS = ["槽位", "长度", "首个为空项", "首个为空项字段"];
function isRef(v) { return v && typeof v === "object" && !Array.isArray(v) && REF_KEYS.some(k => k in v); }
function operandText(v) {
  if (!isRef(v)) return plain(v);
  const [k, a] = Object.entries(v)[0];
  if (k === "槽位") return a;
  if (k === "长度") return `${a} 的长度`;
  if (k === "首个为空项") return `${a[0]} 里首个 ${a[1]} 为空的项的下标`;
  return `${a[0]} 里首个 ${a[1]} 为空的项的 ${a[2]}`;
}
function predicateText(p) {
  if (p["谓词"] === "不为空") return `${p["槽位"]} 不为空`;
  if (p["谓词"] === "列表无项为空") return `${p["槽位"]} 里没有 ${p["字段"]} 为空的项`;
  if (p["谓词"] === "相等") return `${operandText(p["左"])} 等于 ${operandText(p["右"])}`;
  return plain(p);
}
function predicatesText(list) { return (list || []).map(predicateText).join("，且 "); }
function groupText(st, group) {
  const until = JSON.stringify(group.until) === JSON.stringify(st.goal) ? "目标成立" : predicatesText(group.until);
  return `${group.single ? "" : "步骤组 · "}重复直到${until === "目标成立" ? "" : " "}${until} · 最多 = ${operandText(group.max)}`;
}
// 路线图组框底部的文字：「最多」放在前面，框窄被截断时先丢重复条件。
function routeGroupText(st, group) {
  const until = JSON.stringify(group.until) === JSON.stringify(st.goal) ? "目标成立" : predicatesText(group.until);
  return `最多 ${operandText(group.max)} 轮 · 重复直到${until}`;
}
// 任务概览的「阶段与步骤」：有任务定义结构时列出目标、步骤组（重复直到、最多）与步骤（全局号、说明、工具）；
// 旧文件只有依据说明，列全局号与说明，工具名从实际提出过的行动里补。预留的告知异常条目不显示。
function stagesHTML(model) {
  const { def } = model;
  const stepHTML = step => {
    const tool = step.tool || model.toolOf.get(step.number);
    return `<li>第 ${step.number} 步 <b>${esc(step.note)}</b>${tool ? ` <code>${esc(tool)}</code>` : ""}</li>`;
  };
  const itemHTML = st => {
    if (st.auto) return st.tools.map(t => `<li>可选工具 <b>${esc(t.tool)}</b>${model.counts.get(t.number) ? ` <span class="pill">用了 ${model.counts.get(t.number)} 次</span>` : ""}</li>`).join("")
      + (st.max !== undefined ? `<li class="muted">回合上限 ${esc(operandText(st.max))}</li>` : "");
    return st.items.map(item => item.group
      ? `<li><span class="muted">${esc(groupText(st, item.group))}</span><ul class="plain">${item.group.steps.map(stepHTML).join("")}</ul></li>`
      : stepHTML(item.step)).join("");
  };
  return `<ul class="plain">${def.stages.map(st => st.name === null
    ? itemHTML(st)
    : `<li><b>阶段「${esc(st.name)}」</b><span class="tag">${st.auto ? "自主规划" : "固定步骤"}</span>`
      + (st.goal ? ` <span class="muted">目标：${esc(predicatesText(st.goal))}</span>` : "")
      + `<ul class="plain">${itemHTML(st)}</ul></li>`).join("")}</ul>`;
}
function toggleHTML(text) {
  return `<details class="tg"><summary><span class="tg-open">展开</span><span class="tg-close">收起</span></summary><code>${esc(text)}</code></details>`;
}
function resultHTML(value) {
  if (typeof value === "string" && value.includes("\n")) return `<pre>${esc(value)}</pre>`;
  return esc(plain(value));
}
function messageHTML(p) {
  const u = utteranceOf(p.content);
  const head = `${BOX[p.box] || p.box}，类型 ${esc(p.kind)}，发起方 ${esc(p.sender)}，收件人 ${esc(p.recipient)}，到达序号 ${esc(p.seq)}`
    + (p.in_reply_to !== null && p.in_reply_to !== undefined ? `，回复问题 ${esc(p.in_reply_to)}` : "");
  if (u !== null) {
    const rest = Object.assign({}, p.content); delete rest.utterance;
    return `<span class="utterance">${esc(u)}</span>${head}<details><summary>参数</summary><code>${esc(jsonText(rest.params !== undefined ? rest.params : rest))}</code></details>`;
  }
  return `内容 ${resultHTML(p.content)}，${head}`;
}
function describeHTML(e, r) {
  const p = e.payload, n = e.name;
  switch (n) {
    case "TASK_STATUS_CHANGED": return `${esc(p.old_status)} → ${esc(p.new_status)}`;
    case "DATA_CHANGED": {
      if (p.slot === CURSOR && r && r.path) return `游标 → ${esc(positionText(positionOf(r.path.def, p.new)))}，来源 ${esc(p.source)}`;
      const diff = valueDiff(p.old, p.new);
      const lines = diff.length ? diff : ["值未变"];
      return `槽位「${esc(p.slot)}」：${lines.map(l => `<span class="diff-line">${esc(l)}</span>`).join("")}来源 ${esc(p.source)}`
        + ((typeof p.new === "object" && p.new !== null) ? toggleHTML(`${jsonText(p.old)} → ${jsonText(p.new)}`) : "");
    }
    case "ACTION_PROPOSED": return `工具 ${esc(p.tool)}，参数 ${esc(paramsSummary(p.params))}，提出者 ${esc(p.proposer)}，依据 ${esc(basisText(p.basis))}`;
    case "ACTION_STATUS_CHANGED": return `${esc(p.new_status)}，说明：${esc(p.note)}` + ("result" in p ? `，返回值 ${resultHTML(p.result)}` : "");
    case "MESSAGE_PUT": case "MESSAGE_TAKEN": return messageHTML(p);
    case "MAILBOX_CLOSED": return `${BOX[p.box] || esc(p.box)}，发起方 ${esc(p.sender)}，不会再有消息`;
    case "TASK_ENDED": return `终态 ${esc(p.final_status)}，原因：${esc(p.reason)}`;
    case "TASK_STARTED": return `任务定义 ${esc(p.task_def_name)}`;
    case "LOOP_STARTED": return `第 ${esc(p.loop_no)} 次迭代`;
    case "CHECK_DONE_RESULT": return `已完成 = ${p.done ? "是" : "否"}`;
    case "CONTROL_RESULT": return `行动 ${esc(p.action_id)}，结论 ${esc(p.verdict)}，核验：${esc(p.checked)}`;
    case "EXECUTE_CALL": return `行动 ${esc(p.action_id)}，工具 ${esc(p.tool)}，阶段 ${esc(p.phase)}，线程 ${esc(p.thread)}`;
    case "MAILBOX_WAIT": return `${BOX[p.box] || esc(p.box)}，行动 ${esc(plain(p.action_id))}，阶段 ${esc(p.phase)}，线程 ${esc(p.thread)}` + ("wait_ms" in p ? `，等待 ${esc(p.wait_ms)} 毫秒` : "");
    case "TASK_DEFINITION_ERROR": return `原因：${esc(p.reason)}，行动选择原始输出 ${esc(plain(p.raw_output))}`;
    default: return esc(jsonText(p));
  }
}
function finalStatusOf(r) {
  if (r.ended) return { status: String(r.ended.final_status), reason: r.ended.reason };
  const kernelClosed = r.events.some(e => e.name === "MAILBOX_CLOSED" && e.payload.box === "outbox" && !EXTERNAL_SENDERS.includes(e.payload.sender));
  const failed = r.events.filter(e => e.name === "ACTION_STATUS_CHANGED" && e.payload.new_status === FAILED);
  if (r.definitionErrors.length || kernelClosed) {
    return { status: "内核错误", reason: r.definitionErrors.length ? r.definitionErrors[r.definitionErrors.length - 1].payload.reason : (failed.length ? failed[failed.length - 1].payload.note : "") };
  }
  return { status: "未结束", reason: "" };
}
function questionUtterance(r, actionId) {
  const info = r.actions.get(actionId);
  if (!info) return null;
  const q = info.events.find(e => isQuestionSent(e));
  return q ? utteranceOf(q.payload.content) : null;
}

// ───────────── 运行路径：任务定义结构与逐次迭代的位置 ─────────────
// 游标是加载器加进槽位表的保留槽位；页面只认这个名字与它的三项（阶段、已完成步骤、已完成轮数），不认任何任务的槽位。
const CURSOR = "游标", REDO_RESULT = "重做";

function textWidth(text, size) {
  let w = 0;
  for (const ch of String(text)) w += ch.charCodeAt(0) > 0x2e80 ? size : size * 0.6;
  return w;
}
function fit(text, size, max) {
  text = String(text);

  if (!rows.length || !N) return "";
  // 有任务定义结构时按阶段分带：带左侧写阶段名与步数，带内每一步一行（全部步骤，没执行过的行画灰色空心标记）；
  // 自主规划阶段的带内是可选工具各一行。旧文件没有结构，保持一行一个位置的画法。
  const banded = def.structured;
  const COL = 88, ROW = banded ? 40 : 44, T = banded ? 42 : 30, B = 36, R = 40;
  const bandLabel = st => st.auto ? `✦ ${st.name} · ${st.tools.length} 个可选工具` : `${st.name} · ${st.steps.length} 步`;
  const rowLabel = row => !banded ? row.label : (!row.item ? "（没有步骤）" : (row.stage.auto ? row.item.tool : `第 ${row.item.number} 步 ${fit(row.item.note, 12, 130)}`));
  const BL = banded ? Math.max(...def.stages.map(st => textWidth(bandLabel(st), 12))) + 24 : 0;
  const L = BL + Math.max(90, ...rows.map(row => textWidth(rowLabel(row), 12))) + (banded ? 34 : 24);
  const W = L + N * COL + R, H = T + rows.length * ROW + B;
  const x = k => L + (k - 0.5) * COL, y = i => T + i * ROW + ROW / 2;
  let svg = "";
  if (banded) {
    const steps = def.stages.reduce((acc, st) => acc + st.steps.length, 0);
    const walked = def.stages.reduce((acc, st) => acc + st.steps.filter(step => model.counts.get(step.number)).length, 0);
    svg += `<text class="rp-lbl" x="8" y="18">${def.stages.length} 个阶段 · ${steps} 步 · 走过 ${walked} 步</text>`;
    def.stages.forEach((st, index) => {
      const i0 = def.firstRow.get(st), n = Math.max(1, st.auto ? st.tools.length : st.steps.length);
      svg += `<rect class="${index % 2 ? "rp-band2" : "rp-band"}" x="4" y="${T + i0 * ROW + 2}" width="${L + N * COL + 4}" height="${n * ROW - 4}" rx="4"/>`
        + `<text class="rp-bandlbl" x="12" y="${T + i0 * ROW + (n * ROW) / 2 + 4}">${esc(bandLabel(st))}</text>`;
    });
  } else {
    for (const st of def.stages) if (st.auto) {
      const i0 = def.firstRow.get(st);
      svg += `<rect class="rp-band" x="${L - 6}" y="${T + i0 * ROW + 2}" width="${N * COL + 12}" height="${st.tools.length * ROW - 4}" rx="4"/>`
        + `<text class="rp-small" x="${L + N * COL}" y="${T + i0 * ROW + 14}" text-anchor="end">✦ ${esc(st.name)} · 自主规划</text>`;
    }
  }
  rows.forEach((row, i) => {
    const never = banded && row.item && !model.counts.get(row.item.number);
    svg += `<line class="rp-grid" x1="${L - 8}" x2="${W - R}" y1="${y(i)}" y2="${y(i)}"/>`
      + `<text class="rp-rowlbl${never ? " never" : ""}" x="${L - (banded ? 22 : 12)}" y="${y(i) + 4}" text-anchor="end"><title>${esc(banded && row.item && !row.stage.auto ? `第 ${row.item.number} 步 ${row.item.note}` : rowLabel(row))}</title>${esc(rowLabel(row))}</text>`;
    if (never) svg += `<circle class="rp-never" cx="${L - 12}" cy="${y(i)}" r="4"><title>这一步在这次运行里没有执行过</title></circle>`;
  });
  for (let k = 1; k <= N; k++) {
    svg += `<line class="rp-grid" x1="${x(k)}" x2="${x(k)}" y1="${T - 6}" y2="${H - B + 6}"/>`
      + `<text class="rp-axis" x="${x(k)}" y="${H - B + 22}" text-anchor="middle">第 ${iters[k - 1].no} 次迭代</text>`;
  }
  const pts = iters.filter(it => it.row !== null && it.row !== undefined);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const back = y(b.row) < y(a.row) && (a.redo || b.redo);
    svg += `<line class="rp-line${back ? " back" : ""}" x1="${x(a.k)}" y1="${y(a.row)}" x2="${x(b.k)}" y2="${y(b.row)}"/>`;
  }
  if (pts.length) {
    const last = pts[pts.length - 1];
    if (model.completed) {
      if (last.k < N) svg += `<line class="rp-line tail" x1="${x(last.k)}" y1="${y(last.row)}" x2="${x(N)}" y2="${y(last.row)}"/>`;
      svg += `<text class="rp-small rp-good" x="${x(N)}" y="${y(last.row) - 12}" text-anchor="middle">✓ 完成</text>`;
    } else if (model.fin.status === "内核错误") {
      svg += `<text class="rp-small rp-bad" x="${x(last.k)}" y="${y(last.row) + 22}" text-anchor="middle">✕ 内核错误</text>`;
    }
  }
  for (const it of pts) {
    const cx = x(it.k), cy = y(it.row), a = it.action;
    const tip = `第 ${it.no} 次迭代 · 行动 ${a.aid} · ${a.tool} · ${basisText(a.basis)} · ${a.status}`;
    if (it.exception) {
      const outcome = a.result !== undefined ? a.result : (a.answer !== undefined ? plain(a.answer) : a.status);
      svg += `<g class="rp-ptg" data-k="${it.k}"><title>${esc(tip)}</title><rect class="rp-pt bad" x="${cx - 6}" y="${cy - 6}" width="12" height="12" transform="rotate(45 ${cx} ${cy})"/>`
        + `<text class="rp-small rp-bad" x="${cx}" y="${cy - 12}" text-anchor="middle">✕ ${esc(fit(outcome, 11, 70))}</text></g>`;
    } else {
      svg += `<g class="rp-ptg" data-k="${it.k}"><title>${esc(tip)}</title><circle class="rp-pt${it.failed ? " failed" : ""}" cx="${cx}" cy="${cy}" r="6"/></g>`;
    }
  }
  svg += `<line id="rp-cursor-line" class="rp-cursor" x1="${x(N)}" x2="${x(N)}" y1="${T - 6}" y2="${H - B + 6}"/>`;
  return `<section id="path-chart"><h2>路径图</h2>
    <p class="hint">横轴是迭代，纵轴是定义里的位置（自上而下按文件顺序${def.structured ? "，按阶段分带，带内每一步一行" : ""}）。正常运行是一条向下的阶梯；同一高度连续几个点是步骤组在重复；向上的橙色虚线是「重做」退回；红色菱形是告知异常那一次迭代，画在它报的阶段那一行。悬停或点击选中一次迭代，其余几处一起高亮。</p>
    <div class="legend"><span><i class="sw path"></i>行动（蓝点，连线）</span><span><i class="sw bad"></i>✕ 告知异常（旁注使用者的选择）</span><span><i class="sw back"></i>↶ 重做退回（虚线）</span><span><i class="sw" style="border:2.5px solid var(--bad);border-radius:50%"></i>行动已失败</span>${def.structured ? `<span><i class="sw" style="border:1.5px solid var(--ink3);border-radius:50%;background:transparent"></i>没执行过的步骤</span>` : ""}</div>
    <div class="scroll"><svg class="rp" id="path-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="路径图" data-l="${L}" data-col="${COL}">${svg}</svg></div></section>`;
}

// ───────────── 视图：时间轴 ─────────────
function stepperHTML(model) {
  const N = model.iters.length;
  if (!N) return `<section id="stepper"><h2>时间轴</h2><p class="empty">这次运行没有迭代。</p></section>`;
  return `<section id="stepper"><h2>时间轴</h2>
    <p class="hint">拖到第 k 次迭代：路线图、路径图、行动卡片与循环时间线高亮那一次迭代，下面显示该次迭代结束时的游标、行动与槽位值（从事件重建），变过的槽位标黄。游标不当普通槽位列差异，它就是高亮的位置。</p>
    <div class="tl"><button id="tl-prev">◀ 上一次迭代</button>
      <input id="tl-slider" type="range" min="1" max="${N}" value="${N}" aria-label="迭代">
      <button id="tl-next">下一次迭代 ▶</button><span class="tl-val" id="tl-label"></span></div>
    <div class="now">
      <div class="now-card"><h3>游标（这次迭代结束时）</h3><div class="big" id="tl-cursor"></div><div class="muted" id="tl-cursor-sub"></div></div>
      <div class="now-card"><h3>这次迭代的行动</h3><div id="tl-action"></div></div>
      <div class="now-card wide"><h3>槽位（这次迭代结束时）</h3><div class="scroll"><table class="now-kv" id="tl-slots"></table></div></div>
    </div></section>`;
}
function cursorNote(model, it) {
  if (it.redo) return "本次迭代使用者选「重做本阶段」，游标退回该阶段起点";
  if (it.done) return "结果检查为真，任务完成";
  if (it.failed) return "行动已失败，游标不写";
  const before = it.cursorBefore, after = it.cursor, byName = model.def.byName;
  if (before && after && byName.has(before["阶段"]) && byName.has(after["阶段"])) {
    const i0 = byName.get(before["阶段"]).index, i1 = byName.get(after["阶段"]).index;
    const skipped = model.def.stages.slice(i0 + 1, i1).map(st => `「${st.name}」`);
    if (skipped.length) return `跳过目标已成立的阶段${skipped.join("")}`;
  }
  return "";
}
function selectIteration(model, k) {
  const it = model.iters[k - 1];
  if (!it) return;
  const slider = document.getElementById("tl-slider");
  if (slider) slider.value = k;
  document.getElementById("tl-label").textContent = `第 ${it.no} 次迭代` + (k === model.iters.length && (model.completed || model.fin.status === "内核错误") ? "（结束）" : "");
  // 路径图
  const svg = document.getElementById("path-svg");
  if (svg) {
    const L = Number(svg.dataset.l), COL = Number(svg.dataset.col), cx = L + (k - 0.5) * COL;
    const line = document.getElementById("rp-cursor-line");
    line.setAttribute("x1", cx); line.setAttribute("x2", cx);
    svg.querySelectorAll(".rp-pt").forEach(e => e.classList.remove("hi"));
    const pt = svg.querySelector(`.rp-ptg[data-k="${k}"] .rp-pt`);
    if (pt) pt.classList.add("hi");
  }
  // 路线图：这次迭代执行的步骤；告知异常高亮它报的阶段；没有行动时高亮游标所在阶段。
  document.querySelectorAll("#route-svg .rp-step, #route-svg .rp-phase").forEach(e => e.classList.remove("hi"));
  const ref = it.action && it.action.ref;
  if (ref && ref.kind !== "exception") {
    const box = document.querySelector(`#route-svg .rp-step[data-number="${it.action.number}"]`);
    if (box) box.classList.add("hi");
  } else {
    const name = ref ? ref.stage.name : (it.cursor ? it.cursor["阶段"] : undefined);
    if (name !== undefined) document.querySelectorAll("#route-svg .rp-phase").forEach(e => { if (e.dataset.stage === String(name)) e.classList.add("hi"); });
  }
  // 卡片
  const at = positionOf(model.def, it.cursor);
  document.getElementById("tl-cursor").textContent = positionText(at);
  document.getElementById("tl-cursor-sub").textContent = cursorNote(model, it);
  const a = it.action;
  document.getElementById("tl-action").innerHTML = a
    ? `<span class="pill ${it.exception ? "bad" : ""}">行动 ${a.aid}</span> <b>${esc(a.tool)}</b> <span class="pill ${it.failed ? "bad" : ""}">${esc(a.status)}</span>`
      + `<div class="muted">${esc(basisText(a.basis))}</div>`
      + (a.utterance !== null ? `<div style="margin-top:4px">话：${esc(a.utterance)}</div>` : "")
      + (a.answer !== undefined ? `<div>回答：<b>${esc(plain(a.answer))}</b></div>` : "")
      + (a.note ? `<div class="muted">说明：${esc(a.note)}</div>` : "")
    : `<div class="muted">${it.done ? "结果检查为真，任务完成，不提行动" : (it.defError ? "任务定义错误，未提出行动" : "这次迭代没有提出行动")}</div>`;
  document.getElementById("tl-slots").innerHTML = slotRowsHTML(model.run, it.data, it.changed, "当前值", false);
  document.querySelectorAll("#actions .card").forEach(e => e.classList.toggle("hi", Number(e.dataset.k) === k));
  document.querySelectorAll("#timeline .iv-card[data-k]").forEach(e => e.classList.toggle("hi", Number(e.dataset.k) === k));
}
function bindPath(model) {
  const N = model.iters.length;
  if (!N) return;
  // 拖时间轴只高亮；点路径图、路线图步骤格、行动卡片时还把对应的迭代卡滚到眼前。
  const go = (k, locate) => {
    const kk = Math.min(N, Math.max(1, k));
    selectIteration(model, kk);
    const card = locate && document.querySelector(`#timeline .iv-card[data-k="${kk}"]`);
    if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const slider = document.getElementById("tl-slider");
  slider.addEventListener("input", e => go(Number(e.target.value)));
  document.getElementById("tl-prev").onclick = () => go(Number(slider.value) - 1);
  document.getElementById("tl-next").onclick = () => go(Number(slider.value) + 1);
  const svg = document.getElementById("path-svg");
  if (svg) {
    const nearest = e => {
      const rect = svg.getBoundingClientRect(), scale = Number(svg.getAttribute("width")) / rect.width;
      const px = (e.clientX - rect.left) * scale;
      return Math.round((px - Number(svg.dataset.l)) / Number(svg.dataset.col) + 0.5);
    };
    svg.addEventListener("mousemove", e => { const k = nearest(e); if (k >= 1 && k <= N && k !== Number(slider.value)) go(k); });
    svg.addEventListener("click", e => { const k = nearest(e); if (k >= 1 && k <= N) go(k, true); });
  }
  document.querySelectorAll("#route-svg .rp-step").forEach(box => box.addEventListener("click", () => {
    const it = model.iters.find(x => x.action && x.action.number === Number(box.dataset.number) && !x.exception);
    if (it) go(it.k, true);
  }));
  document.querySelectorAll("#actions .card").forEach(card => card.addEventListener("click", e => {
    if (e.target.closest("details, a, button")) return;
    if (card.dataset.k) go(Number(card.dataset.k), true);
  }));
  go(N);
}


// ───────────── 视图：运行索引 ─────────────
const state = { runs: [], sortDesc: true, taskFilter: "", statusFilter: "", checked: new Set() };

async function renderIndex() {
  document.getElementById("filters-slot").innerHTML = "";
  document.getElementById("crumb").textContent = "";
  const app = document.getElementById("app");
  try { state.runs = await fetchJSON("api/runs"); }
  catch (err) { app.innerHTML = `<section><p class="error">读取运行索引失败：${esc(err.message)}</p></section>`; return; }
  const taskNames = [...new Set(state.runs.map(r => r.task_def_name || "（无任务开始事件）"))].sort();
  const statuses = [...new Set(state.runs.map(r => r.final_status))].sort();
  app.innerHTML = `<section id="index">
    <h2>运行索引 <small class="muted" id="index-count"></small></h2>
    <div class="toolbar">
      <label>任务定义 <select id="f-task"><option value="">全部</option>${taskNames.map(n => `<option>${esc(n)}</option>`).join("")}</select></label>
      <label>终态 <select id="f-status"><option value="">全部</option>${statuses.map(n => `<option>${esc(n)}</option>`).join("")}</select></label>
      <button id="sort">开始时刻：${state.sortDesc ? "最近在上" : "最早在上"}</button>
      <button id="compare" disabled>对比勾选的两次运行</button>
      <span class="muted" id="checked-count"></span>
    </div>
    <div class="scroll"><table class="index"><thead><tr><th>对比</th><th>开始时刻</th><th>任务定义</th><th>任务标识</th><th>终态</th><th>原因</th><th>迭代数</th><th>行动数</th><th>事件数</th><th>耗时毫秒</th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="hint">点一行看运行详情；勾选两行后点「对比」。开始时刻标 * 的是旧命名文件，时刻取自文件修改时间。页面不自动刷新，要看新的运行请刷新。</p>
  </section>`;
  document.getElementById("f-task").value = state.taskFilter;
  document.getElementById("f-status").value = state.statusFilter;
  document.getElementById("f-task").onchange = e => { state.taskFilter = e.target.value; drawRows(); };
  document.getElementById("f-status").onchange = e => { state.statusFilter = e.target.value; drawRows(); };
  document.getElementById("sort").onclick = e => { state.sortDesc = !state.sortDesc; e.target.textContent = `开始时刻：${state.sortDesc ? "最近在上" : "最早在上"}`; drawRows(); };
  document.getElementById("compare").onclick = () => { const [a, b] = [...state.checked]; location.hash = `#compare=${encodeURIComponent(a)},${encodeURIComponent(b)}`; };
  drawRows();
}
function drawRows() {
  const rows = state.runs
    .filter(r => !state.taskFilter || (r.task_def_name || "（无任务开始事件）") === state.taskFilter)
    .filter(r => !state.statusFilter || r.final_status === state.statusFilter)
    .sort((a, b) => (a.started_at < b.started_at ? -1 : a.started_at > b.started_at ? 1 : a.file < b.file ? -1 : 1) * (state.sortDesc ? -1 : 1));
  const tbody = document.getElementById("rows");
  tbody.innerHTML = rows.map(r => {
    const cls = r.final_status === "已完成" ? "done" : (r.final_status === "内核错误" ? "error" : "");
    return `<tr data-file="${esc(r.file)}">
      <td><input type="checkbox" aria-label="勾选用于对比" ${state.checked.has(r.file) ? "checked" : ""}></td>
      <td class="mono">${esc(r.started_at)}${r.started_at_source === "文件名" ? "" : " *"}</td>
      <td>${esc(r.task_def_name || "（无任务开始事件）")}</td><td class="mono">${esc(r.task_id)}</td>
      <td class="status ${cls}">${esc(r.final_status)}</td><td class="reason">${esc(r.reason)}</td>
      <td>${r.loops}</td><td>${r.actions}</td><td>${r.events}</td><td>${r.duration_ms}</td></tr>`;
  }).join("") || `<tr><td colspan="10" class="muted">没有符合条件的运行。</td></tr>`;
  document.getElementById("index-count").textContent = `显示 ${rows.length} / ${state.runs.length} 次运行`;
  tbody.querySelectorAll("tr[data-file]").forEach(tr => {
    const box = tr.querySelector("input");
    box.onclick = ev => { ev.stopPropagation(); box.checked ? state.checked.add(tr.dataset.file) : state.checked.delete(tr.dataset.file); updateCompareButton(); };
    tr.onclick = () => { location.hash = `#run=${encodeURIComponent(tr.dataset.file)}`; };
  });
  updateCompareButton();
}
function updateCompareButton() {
  const n = state.checked.size;
  document.getElementById("compare").disabled = n !== 2;
  document.getElementById("checked-count").textContent = n ? `已勾选 ${n} 次${n === 2 ? "" : "（需要恰好两次）"}` : "";
}

// ───────────── 视图：运行详情 ─────────────
async function renderRun(file) {
  const app = document.getElementById("app");
  document.getElementById("crumb").textContent = ` / ${file}`;
  let events;
  try { events = await fetchJSON(`api/runs/${encodeURIComponent(file)}`); }
  catch (err) { document.getElementById("filters-slot").innerHTML = ""; app.innerHTML = `<section><p class="error">读取运行失败：${esc(err.message)}</p></section>`; return; }
  const r = buildRecord(file, events);
  r.path = buildPath(r);
  document.getElementById("filters-slot").innerHTML = filtersHTML(r);
  const pathViews = r.started ? routeHTML(r.path) + pathChartHTML(r.path) + stepperHTML(r.path) : "";
  app.innerHTML = overviewHTML(r) + deliverablesHTML(r) + pathViews + iterationsHTML(r) + slotsHTML(r) + cardsHTML(r);
  document.querySelectorAll("[data-scroll-to]").forEach(el => el.addEventListener("click", () => {
    const target = document.getElementById(el.dataset.scrollTo);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  bindIterations();
  bindFilters();
  if (r.started) bindPath(r.path);
}
function filtersHTML(r) {
  return `<nav class="filters" aria-label="过滤">
    <fieldset><legend>事件类别</legend>
      <label><input type="radio" name="kind" value="all" checked> 全部</label>

      <label><input type="radio" name="kind" value="trace"> 只看追踪事件</label></fieldset>
    <fieldset><legend>谁引起</legend>
      <label><input type="radio" name="origin" value="all" checked> 全部</label>
      <label><input type="radio" name="origin" value="kernel"> 只看内核</label>
      <label><input type="radio" name="origin" value="tool"> 只看工具实现</label>
      <label><input type="radio" name="origin" value="external"> 只看外部</label></fieldset>
    <label>行动 <select id="f-action"><option value="">全部</option>${[...r.actions.keys()].map(a => `<option value="${a}">行动 ${a}</option>`).join("")}</select></label>

}
// 槽位表（概览与时间轴共用）：表头 槽位、类型、值、说明。类型与说明取自 definition 的槽位元数据，旧文件留空；
// 列表显示「n 项」、字典显示摘要，都带「展开／收起」；「游标」行标保留槽位，值写可读位置；changed 里的行标黄。
// withItems 为真时，列表型槽位下面缩进列出项字段（类型、说明、提问）。
function valueHTML(v) {
  if (Array.isArray(v)) return `${v.length} 项${toggleHTML(jsonText(v))}`;
  if (v && typeof v === "object") return `${esc(brief(v))}${toggleHTML(jsonText(v))}`;
  return esc(plain(v));
}
function slotRowsHTML(r, values, changed, valueLabel, withItems) {
  const metas = (r.started && r.started.definition && r.started.definition["槽位"]) || {};

      </dl></article>`;
  }).join("");
  return `<section id="actions"><h2>行动卡片</h2><div class="cards">${cards || `<p class="empty">这次运行没有提出任何行动。</p>`}</div></section>`;
}
// 顶部四个过滤器只高亮命中的原始事件与它所在的叙事行，其余变淡，不隐藏；行动卡片与槽位轨迹里不相关的变淡。
function bindFilters() {
  const apply = () => {
    const kind = document.querySelector("input[name=kind]:checked").value;
    const origin = document.querySelector("input[name=origin]:checked").value;
    const action = document.getElementById("f-action").value;
    const slot = document.getElementById("f-slot").value;
    const active = kind !== "all" || origin !== "all" || Boolean(action) || Boolean(slot);
    const slotsOf = el => { try { return JSON.parse(el.dataset.slots || "[]"); } catch (_) { return []; } };
    const section = document.getElementById("timeline");
    if (section) section.classList.toggle("dim", active);
    document.querySelectorAll("#timeline .iv-v.match").forEach(v => v.classList.remove("match"));
    document.querySelectorAll("#timeline .iv-evs.by-filter").forEach(box => {
      box.classList.remove("show", "by-filter");
      const t = document.querySelector(`.iv-toggle[data-for="${box.id}"]`);
      if (t) t.classList.remove("on");
    });
    let hits = 0, total = 0;
    document.querySelectorAll("#timeline .iv-evs tr[data-seq]").forEach(row => {
      total++;
      const ok = active && (kind === "all" || row.dataset.kind === kind) && (origin === "all" || row.dataset.origin === origin)
        && (!action || row.dataset.action === action) && (!slot || slotsOf(row).includes(slot));
      row.classList.toggle("fm", ok);
      if (!ok) return;
      hits++;
      const box = row.closest(".iv-evs");
      if (!box.classList.contains("show")) {
        box.classList.add("show", "by-filter");
        const t = document.querySelector(`.iv-toggle[data-for="${box.id}"]`);
        if (t) t.classList.add("on");
      }
      const v = document.querySelector(`#timeline .iv-v[data-row="${box.id}"]`);
      if (v) v.classList.add("match");
    });
    document.querySelectorAll(".card").forEach(card => card.classList.toggle("faded", Boolean((action && card.dataset.action !== action) || (slot && !slotsOf(card).includes(slot)))));
    document.querySelectorAll(".slot-row").forEach(row => row.classList.toggle("faded", Boolean(slot && !slotsOf(row).includes(slot))));
    document.getElementById("f-count").textContent = active ? `迭代视图里高亮 ${hits} / ${total} 个事件` : `共 ${total} 个事件`;
  };
  document.querySelectorAll("input[name=kind], input[name=origin]").forEach(i => i.addEventListener("change", apply));
  document.getElementById("f-action").addEventListener("change", apply);
  document.getElementById("f-slot").addEventListener("change", apply);
  apply();
}

// ───────────── 视图：对比 ─────────────
function actionRow(r, info) {
  if (!info) return null;
  const p = info.proposed.payload;
  const history = info.events.filter(e => e.name === "ACTION_STATUS_CHANGED");
  const u = questionUtterance(r, info.proposed.action_id);
  return {
    tool: p.tool,
    what: u !== null ? u : paramsSummary(p.params),
    status: history.length ? history[history.length - 1].payload.new_status : "—",
    slots: [...new Set(info.events.filter(e => e.name === "DATA_CHANGED").map(e => e.payload.slot))].join("、") || "（无）",
  };
}
async function renderCompare(a, b) {
  document.getElementById("filters-slot").innerHTML = "";
  document.getElementById("crumb").textContent = " / 对比";
  const app = document.getElementById("app");
  let left, right;
  try {
    const [ea, eb] = await Promise.all([fetchJSON(`api/runs/${encodeURIComponent(a)}`), fetchJSON(`api/runs/${encodeURIComponent(b)}`)]);
    left = buildRecord(a, ea); right = buildRecord(b, eb);
  } catch (err) { app.innerHTML = `<section><p class="error">读取运行失败：${esc(err.message)}</p></section>`; return; }
  const head = r => {
    const fin = finalStatusOf(r);
    return `<b>${esc(r.started ? r.started.task_def_name : "（无任务开始事件）")}</b><br><code>${esc(r.file)}</code><br>`
      + `终态 <b>${esc(fin.status)}</b>${fin.reason ? `，${esc(fin.reason)}` : ""}；${r.loops.length} 次迭代，${r.actions.size} 个行动`
      + `<br><a href="#run=${encodeURIComponent(r.file)}">看详情</a>`;
  };
  const la = [...left.actions.values()], ra = [...right.actions.values()];
  const n = Math.max(la.length, ra.length);
  const fields = [["tool", "工具"], ["what", "话或参数"], ["status", "终态"], ["slots", "变更的槽位"]];
  let differing = 0;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const x = actionRow(left, la[i]), y = actionRow(right, ra[i]);
    const cells = side => fields.map(([key]) => {
      const mine = side === "l" ? x : y, other = side === "l" ? y : x;
      if (!mine) return `<td class="absent" data-field="${key}">（无）</td>`;
      const cls = !other || other[key] !== mine[key] ? "diff" : "same";
      return `<td class="${cls}" data-field="${key}">${esc(mine[key])}</td>`;
    }).join("");
    const rowDiffers = !x || !y || fields.some(([key]) => x[key] !== y[key]);
    if (rowDiffers) differing++;
    rows.push(`<tr data-row="${i + 1}" data-differs="${rowDiffers}"><td class="no">${i + 1}</td>${cells("l")}${cells("r")}</tr>`);
  }
  const slots = [...new Set([...left.slots, ...right.slots])];
  let slotDiffering = 0;
  const dataRows = slots.map(slot => {
    const x = left.finalData[slot], y = right.finalData[slot];
    const same = JSON.stringify(x) === JSON.stringify(y);
    if (!same) slotDiffering++;
    const cell = v => `${esc(brief(v))}${typeof v === "object" && v !== null ? toggleHTML(jsonText(v)) : ""}`;
    const diff = same ? "相同" : (valueDiff(x === undefined ? null : x, y === undefined ? null : y).join("；") || "不同");
    return `<tr data-slot="${esc(slot)}" data-differs="${!same}"><th>${esc(slot)}</th><td class="${same ? "same" : "diff"}">${cell(x)}</td><td class="${same ? "same" : "diff"}">${cell(y)}</td><td class="${same ? "same" : "diff"}">${esc(diff)}</td></tr>`;
  }).join("");
  app.innerHTML = `<section id="compare">
    <h2>对比</h2>
    <div class="scroll"><table class="compare"><thead><tr><th></th><th>左</th><th>右</th></tr></thead>
      <tbody><tr><td class="no">运行</td><td>${head(left)}</td><td>${head(right)}</td></tr></tbody></table></div>
  </section>
  <section id="compare-actions">
    <h2>行动序列 <small class="muted">按位置对齐；${differing} / ${n} 行有不同，黄色是不同处，灰色是相同处，「（无）」表示该侧没有这一行</small></h2>
    <div class="scroll"><table class="compare"><thead><tr><th rowspan="2">行</th><th colspan="4">左</th><th colspan="4">右</th></tr>
      <tr>${fields.map(([, label]) => `<th>${label}</th>`).join("")}${fields.map(([, label]) => `<th>${label}</th>`).join("")}</tr></thead>
      <tbody>${rows.join("") || `<tr><td colspan="9" class="muted">两次运行都没有行动。</td></tr>`}</tbody></table></div>
  </section>
  <section id="compare-data">
    <h2>终态数据 <small class="muted">逐槽位并排；${slotDiffering} / ${slots.length} 个槽位不同</small></h2>
    <div class="scroll"><table class="compare"><thead><tr><th>槽位</th><th>左</th><th>右</th><th>差异</th></tr></thead><tbody>${dataRows}</tbody></table></div>
  </section>`;
}

// ───────────── 路由：地址栏记视图，刷新不丢 ─────────────
function route() {
  const hash = location.hash.replace(/^#/, "");
  window.scrollTo(0, 0);
  if (hash.startsWith("run=")) return renderRun(decodeURIComponent(hash.slice(4)));
  if (hash.startsWith("compare=")) {
    const [a, b] = hash.slice(8).split(",").map(decodeURIComponent);
    return renderCompare(a, b);
  }
  return renderIndex();
}
window.addEventListener("hashchange", route);
route();
