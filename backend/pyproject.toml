[project]
name = "req-doc-backend"
version = "0.1.0"
description = "需求治理平台后端（v0.1，SCN-001-P01 文本接入切片）"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg[binary]",
  "httpx",
  "pyyaml",
  "redis>=5",
  "rq>=1.16",
  "python-docx>=1.2.0",
  "jinja2>=3.1.6",
  "pgvector>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

# ---- 坏味道警戒线（docs/v2/drafts/坏味道治理方案-讨论稿.md 第一层，2026-08-07 用户定案）----
# 规则集显式钉死（不随 ruff 版本默认漂移）：E4/E7/E9/F＝语法与引用基本卫生，C90＝圈复杂度红线 15。
# 存量违规按「只减不增」列入 per-file-ignores 基线；新文件触线即红。跑法：backend/tools/smell_check.sh。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# 复杂度基线（2026-08-07 实测 23 处；处置时机见热点档案，只许减不许增）
"app/services/item_review.py" = ["C901", "F841"]
"app/services/item_formation.py" = ["C901"]
"app/services/trace_analysis.py" = ["C901"]
"app/services/publication.py" = ["C901"]
"app/services/config_registry.py" = ["C901"]
"app/services/runtime_status.py" = ["C901"]
"app/services/analysis_source_changes.py" = ["C901"]
"app/services/analysis_dialogue.py" = ["C901"]
"app/adapters/llm.py" = ["C901"]
"app/adapters/docx_convert.py" = ["C901"]
"app/adapters/doc_template.py" = ["C901"]
"app/scripts/seed_full_demo.py" = ["C901", "E741"]
# deps.py：函数内延迟导入＋字符串注解（防循环依赖的既有写法），ruff 识别不了
"app/deps.py" = ["F821"]
# 歧义单字母变量名存量（11 处），随刀清理
"app/services/chart_collaboration.py" = ["E741"]

# ---- 分层契约（import-linter；跑法同上）----
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "领域层纯净：domain 不依赖 api/services/repositories/adapters"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.api", "app.services", "app.repositories", "app.adapters"]

[[tool.importlinter.contracts]]
name = "适配器层不依赖 API 层"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "仓储层不直引 API 层（存量两处入基线，只许减不许增）"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = ["app.api"]
allow_indirect_imports = "True"
ignore_imports = [
    "app.repositories.sqlalchemy -> app.api.schemas",
    "app.repositories.in_memory -> app.api.schemas",
]

[[tool.importlinter.contracts]]
name = "仓储层不直引服务层（存量基线：sqlalchemy 8 处、in_memory 3 处、agent_run 1 处；只许减不许增）"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = ["app.services"]
allow_indirect_imports = "True"
ignore_imports = [
    "app.repositories.sqlalchemy -> app.services.analysis_transformation",
    "app.repositories.sqlalchemy -> app.services.chart_collaboration",
    "app.repositories.sqlalchemy -> app.services.item_formation",
    "app.repositories.sqlalchemy -> app.services.item_review",
    "app.repositories.sqlalchemy -> app.services.material_receiving",
    "app.repositories.sqlalchemy -> app.services.model_orchestration",
    "app.repositories.sqlalchemy -> app.services.config_registry",
    "app.repositories.sqlalchemy -> app.services.trace_analysis",
    "app.repositories.in_memory -> app.services.analysis_transformation",
    "app.repositories.in_memory -> app.services.material_receiving",
    "app.repositories.in_memory -> app.services.model_orchestration",
    "app.repositories.agent_run -> app.services.notification",
]

[dependency-groups]
dev = [
    "fakeredis>=2",
    # 测试运行器。原仓曾手工装进 .venv 未入声明，换机器 uv sync 后 pytest 缺失，
    # 2026-08-17 迁出到本仓时补进声明，保证锁文件即可完整重建开发环境。
    "pytest>=8",
]
