# 领域术语种子（供术语显著性判别参考；不作为要素内容来源）
- term: 履约单
  definition: 从下单到出库的一次完整订单处理流程记录
- term: SKU
  definition: 最小存货单位，标识可独立管理与销售的商品单品
- term: 拣货
  definition: 按订单从库位取出对应商品的仓储作业
- term: 出库
  definition: 商品经复核后离开仓库、移交承运环节的动作
- term: 支付对账
  definition: 将平台交易流水与支付渠道/银行流水逐笔核对以发现差异的过程
- term: 履约时效
  definition: 从订单确认到出库（或签收）所耗时间的服务承诺口径
