# 质量属性完备性判据（蓝本：QAS 六要素，重点响应度量；设计增补 §1）
element_type: quality_attribute
rubric_version: 1
facets:
  - key: stimulus
    label: 刺激
    required: true
    criteria: 明确在什么情况下该质量要求被触发（负载、事件、故障、操作等刺激来源与刺激）
    revision_hint: 请补充该质量要求的适用场景，例如「在峰值并发 1000 用户时…」「当单节点故障时…」
  - key: response
    label: 响应
    required: true
    criteria: 明确系统面对刺激应表现出的行为或能力
    revision_hint: 请写明系统应有的响应，例如「系统继续提供查询服务」「请求被正常处理」
  - key: response_measure
    label: 响应度量
    required: true
    criteria: 存在可测量的阈值或指标（数值 + 单位 + 统计口径/条件），可据以验收
    revision_hint: 请给出可验证的量化指标，例如「95% 请求响应时间 < 2 秒」「恢复时间 ≤ 30 分钟」
  - key: environment
    label: 环境
    required: false
    criteria: 说明刺激发生时的运行环境或负载条件（正常运行/降级/维护等）
    revision_hint: 如有必要，请补充适用的运行环境，例如「正常运行状态下」「月末批处理期间」
