# 中文 EARS 方案元数据（设置页 AEP-102 展示单一来源；选型文档 §1.3/§1.4）
convention_key: ears-cn
display_name: 中文 EARS
blueprint: EARS 五句型中文化（需求规约模板体系技术报告 §3.1）
positioning: 基础句型规范：简单、易读，适合快速梳理功能行为；现行档案即此方案。五类需求以「触发条件下，执行者应可执行响应」为骨架，触发条件缺省仅限常驻能力。
pattern_overview:
  - label: 功能需求
    pattern: 「〔当/在 <触发条件> 时/期间，〕<执行者（默认为系统）> 应 <可执行的系统响应>，〔并 <可观测结果>〕」
  - label: 质量属性
    pattern: 「在 <环境/负载条件> 下，当 <刺激> 时，系统应 <响应>，且 <响应度量：数值 + 单位 + 统计口径>」——QAS 六要素 + 量化度量
  - label: 约束
    pattern: 「〔依据 <出处>，〕<作用范围> 必须/禁止 <明确的限定内容>」——出处约束三元
  - label: 数据需求
    pattern: 「系统应记录/维护 <数据对象>，含 <关键属性清单>，〔保存 <生存期> / 预期 <量级>〕」——数据需求要项
  - label: 接口需求
    pattern: 「系统应与 <对端> 以 <方向：推送/拉取/双向/回调> 交换 <交换内容>；<异常情形> 时 <异常行为>」——接口需求要项
examples:
  - req_type: functional
    statement: 当用户提交原始需求文本时，系统应生成候选知识项列表，并展示识别进度
  - req_type: quality
    statement: 在月末结算期间并发查询不超过 100 路时，需求列表查询的响应时间应不超过 2 秒
  - req_type: constraint
    statement: 依据 GB/T 9385-2008，发布的软件需求规格说明书章节结构应遵循该标准附录大纲，适用于全部正式发布物
  - req_type: data
    statement: 系统应记录需求条目的编号、类型、状态、来源要素引用与更新时间，保存期不少于项目生命周期
  - req_type: interface
    statement: 系统应能够通过标准数据交换接口接收外部 ALM 系统提供的需求条目；接收失败时应保留失败原因并支持重试
