# 约束条目档案（方案：中文 Boilerplates；选型文档 §1.4）
# 公共模态词/质量规则见 common.yaml。facets 沿用 ears-cn 约束档案键以对齐跨方案 UI。
convention_key: boilerplate-cn
req_type: constraint
profile_version: 1
statement_pattern: 「依据 <出处>，<系统/过程> 在 <作用范围> 内应/不得 <约束行为>」——Boilerplates 约束样板句。
facets:
  - key: statement
    label: 约束陈述
    required: true
    criteria: 约束内容本身表述明确（必须/禁止/限定什么），不是模糊的期望
    revision_hint: 请把约束写成明确的限定语句，例如「必须使用国密算法存储口令」
  - key: source
    label: 出处
    required: true
    criteria: 陈述写明约束来自哪里（法规、标准、合同、既有系统、组织制度等）
    revision_hint: 请补写约束出处，例如「依据等保 2.0 三级要求」「合同附件 B 约定」
  - key: scope
    label: 作用范围
    required: true
    criteria: 陈述写明约束作用于哪些对象、模块、环节或阶段
    revision_hint: 请写明约束的作用范围，例如「适用于所有对外接口」「仅限生产环境」
payload_fields:
  - key: statement
    label: 约束陈述
    facet_ref: statement
  - key: source
    label: 出处
    facet_ref: source
  - key: scope
    label: 作用范围
    facet_ref: scope
