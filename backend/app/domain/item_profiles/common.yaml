# 方案无关公共写作约束（选型文档 §4；报告 §2.4 模态词 + §8.4 质量规则 Q1–Q7）。
# 随任一方案档案一并注入格式化/修订 Prompt，并供陈述达标判定复用；各方案档案只写方案特有判定，公共规则以本文件为单一来源。
modal_words:
  intro: 模态词决定需求的强制程度与验收责任，须严格统一，不得混用口语化或含糊用词。
  required: 应 / 不应（强制性要求）
  recommended: 宜 / 不宜（推荐性要求）
  permitted: 可（允许性要求）
  forbidden: 不得（禁止性要求）
  banned: 必须、应该、需要、可以、最好、尽量、原则上、一般情况下
quality_rules:
  - key: Q1
    label: 主体明确
    rule: 每条需求写明行为主体（系统或明确角色），不缺主语、不含糊。
  - key: Q2
    label: 动作具体
    rule: 动作可执行、可验证；禁裸用「支持 / 处理 / 管理 / 优化 / 更好地」类泛动词。
  - key: Q3
    label: 对象明确
    rule: 动作的作用对象明确具体，不写成「生成结果」「处理数据」等空泛表述。
  - key: Q4
    label: 条件明确
    rule: 有前置条件的需求写明触发条件（当/在/如果…则…），不隐含条件。
  - key: Q5
    label: 质量量化
    rule: 质量类要求给出可测量的数值、单位与统计口径/条件，不写「快速」「稳定」等无法验收的形容。
  - key: Q6
    label: 一条一动作
    rule: 一条需求只表达一个主要动作；禁复合需求（「解析、检测并生成…」应拆为多条）。
  - key: Q7
    label: 模态词统一
    rule: 全文模态词统一使用「应 / 不应 / 宜 / 不宜 / 可 / 不得」，不与被禁用词混用。
